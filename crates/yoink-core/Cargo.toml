[package]
name = "yoink-core"
version = "0.1.0"
license = "GPL-3.0-or-later"
rust-version = "1.98"
edition = "2024"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.0"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
tempfile = "3.27.0"
